name: Bug for the agent
description: A bug report written so an unattended agent can fix it. Label it agent:fix when it is ready.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The agent has no one to ask. Everything it needs has to be on this page.
        The more precise the repro, the fewer turns (and dollars) the fix takes.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The wrong behavior, with the exact error message or log line if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where to look (optional)
      description: A file, function or recent PR you suspect. Saves the agent a search.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How you will know it is fixed. A failing test the fix should make pass is ideal.
