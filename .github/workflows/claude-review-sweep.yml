# Daily review sweep across every open PR.
#
# Reviewers (a bot, Codex, a human) leave comments at any hour. This runs the
# `review-sweep` skill once a day: every unhandled comment ends in a terminal
# state (fixed and pushed, or declined with a reason), and a PR with green CI,
# no open threads and an approving verdict gets one "ready to merge" comment.
# Your only job is the merge button.
#
# Why a daily sweep instead of a run per comment: one sweep that batches every
# PR costs one session. A run per comment costs one session per comment, and
# review bots comment in bursts.
#
# Trust: the sweep reads review comment text and can push. Fine for a private
# repo where every commenter is you or a bot you installed. On a public repo
# anyone can comment, so the `gate` job skips the schedule there and only
# allows a manual run on one same-repo PR (see docs/GUARDRAILS.md).

name: Claude review sweep

on:
  schedule:
    # 13:00 UTC daily. Pick a time before you usually check GitHub.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Sweep one PR number (blank = all open PRs)'
        required: false

concurrency:
  group: claude-review-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The schedule event carries no repository visibility, so ask the API. On a
  # public repo, only a manual run on one PR from this repo goes ahead: a blank
  # `pr` would sweep every PR, and a fork PR's checks would run a stranger's
  # code with the PAT in the environment. Fails closed: if a lookup errors,
  # this job fails and the sweep does not run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip the schedule on public repos
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.inputs.pr }}
        run: |
          visibility="$(gh api "repos/$REPO" --jq .visibility)"
          if [ "$visibility" != public ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = schedule ]; then
            echo "::notice::Public repo: the scheduled sweep is off because it would act on review comments from anyone. Run it by hand on a PR you have read."
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Public repo: set the pr input to one PR number whose comments you have read."
            exit 1
          fi
          head="$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.full_name)"
          if [ "$head" != "$REPO" ]; then
            echo "::error::PR #$PR comes from ${head:-a deleted fork}. The sweep runs a PR's checks with push credentials, so it never runs on fork PRs."
            exit 1
          fi
          echo run=true >> "$GITHUB_OUTPUT"

  sweep:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Your toolchain and dependencies, from .claude/agent-ci.json. The config
      # is read from the default branch, so the command allowlist comes from
      # reviewed config, not from a branch under review.
      - name: Project setup
        id: project
        uses: ./.github/actions/project-setup
        with:
          config-ref: origin/${{ github.event.repository.default_branch }}

      # Named subcommands, not `gh pr:*` or `git:*`: the sweep never merges, and
      # a bare `git` prefix hands it `git -c alias.x='!cmd'`. This is defense in
      # depth, not a boundary: with Edit and the project's checks allowed, the
      # agent can still run code it writes, and `gh api` (needed for reactions
      # and review threads) still reaches the merge endpoint. Branch protection
      # is the real merge gate (docs/GUARDRAILS.md). `gh pr create` is for the
      # skill's `<pr-branch>-review-fixes` side PRs.
      - name: Run review sweep
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the review-sweep skill in .claude/skills/review-sweep/ on ${{ github.repository }}
            ${{ github.event.inputs.pr && format('for PR #{0} only', github.event.inputs.pr) || 'across every open PR' }}.
            Use the gh CLI for GitHub reads and writes.
            After checking out each PR branch, run `commands.install` from
            .claude/agent-ci.json before any checks, so no PR is tested with
            another branch's dependencies. The runtimes on this runner are the
            default branch's: if a PR changes a `toolchain` version file or
            .claude/agent-ci.json itself, do not judge it by local checks; use
            the result of its own CI run instead.
          claude_args: >-
            --model ${{ vars.AGENT_SWEEP_MODEL || 'sonnet' }}
            --max-turns ${{ vars.AGENT_MAX_TURNS_SWEEP || '60' }}
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Skill,Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr checkout:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr ready:*),Bash(gh api:*),Bash(gh run:*),${{ steps.project.outputs.allowed-bash }},Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git remote:*),Bash(git branch:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git pull:*),Bash(git merge:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(gh pr merge:*)"
        env:
          GH_TOKEN: ${{ secrets.AGENT_PR_TOKEN || github.token }}
