# Daily review sweep across every open PR.
#
# Reviewers (a bot, Codex, a human) leave comments at any hour. This runs the
# `review-sweep` skill once a day: every unhandled comment ends in a terminal
# state (fixed and pushed, or declined with a reason), and a PR with green CI,
# no open threads and an approving verdict gets one "ready to merge" comment.
# Your only job is the merge button.
#
# Agent PRs also get `claude-review-respond.yml`, which runs this same skill on
# one PR as soon as a review lands. This sweep is the backstop: human PRs,
# PRs past the per-PR cap, and webhooks GitHub dropped. One sweep that batches
# every PR costs one session.
#
# Trust: the sweep reads review comment text and can push. Fine for a private
# repo where every commenter is you or a bot you installed. On a public repo,
# restrict it (see docs/GUARDRAILS.md) before enabling the schedule.

name: Claude review sweep

on:
  schedule:
    # 13:00 UTC daily. Pick a time before you usually check GitHub.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Sweep one PR number (blank = all open PRs)'
        required: false

concurrency:
  group: claude-review-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Your toolchain and dependencies, from .claude/agent-ci.json. The config
      # is read from the default branch, so the command allowlist comes from
      # reviewed config, not from a branch under review.
      - name: Project setup
        id: project
        uses: ./.github/actions/project-setup
        with:
          config-ref: origin/${{ github.event.repository.default_branch }}

      - name: Run review sweep
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the review-sweep skill in .claude/skills/review-sweep/ on ${{ github.repository }}
            ${{ github.event.inputs.pr && format('for PR #{0} only', github.event.inputs.pr) || 'across every open PR' }}.
            Use the gh CLI for GitHub reads and writes.
            After checking out each PR branch, run `commands.install` from
            .claude/agent-ci.json before any checks, so no PR is tested with
            another branch's dependencies. The runtimes on this runner are the
            default branch's: if a PR changes a `toolchain` version file or
            .claude/agent-ci.json itself, do not judge it by local checks; use
            the result of its own CI run instead.
          claude_args: >-
            --model ${{ vars.AGENT_SWEEP_MODEL || 'sonnet' }}
            --max-turns ${{ vars.AGENT_MAX_TURNS_SWEEP || '60' }}
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Skill,Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr ready:*),Bash(gh pr create:*),Bash(gh api:*),Bash(gh run:*),${{ steps.project.outputs.allowed-bash }},Bash(git:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(gh pr merge:*),Bash(gh api *merge*),Bash(gh api *Merge*)"
        env:
          GH_TOKEN: ${{ secrets.AGENT_PR_TOKEN || github.token }}
