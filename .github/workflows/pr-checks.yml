# The mechanical checks, on every PR that changes code. Agents run the same
# `commands.check` from .claude/agent-ci.json before they push, so a red run here means
# the agent skipped a step, not that CI knows something the agent didn't.
#
# Docs- and config-only PRs skip this job entirely (the `paths:` filter), which
# matters when agents open PRs all day. If you make this a required status
# check, use a ruleset that allows skipped checks, or drop the filter.

name: PR checks

on:
  pull_request:
    # GitHub reads this list before any runner starts, so it cannot come from
    # the config. Point it at your source files, manifests and build files.
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Makefile
      - setup/**
      - .claude/agent-ci.json
      - .github/actions/project-setup/**
      - .github/workflows/pr-checks.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The PR's own config: a PR that changes the toolchain is tested with it.
      - id: project
        uses: ./.github/actions/project-setup
      - name: Run checks
        env:
          CHECKS: ${{ steps.project.outputs.check }}
        run: |
          while IFS= read -r cmd; do
            echo "::group::$cmd"
            bash -euo pipefail -c "$cmd" || { echo "::endgroup::"; echo "::error::Check failed: $cmd"; exit 1; }
            echo "::endgroup::"
          done <<< "$CHECKS"
