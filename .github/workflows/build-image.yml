# SOURCE-HASH-GATED BUILDS (module 4).
#
# Agents open a lot of PRs, and a lot of them only touch docs, tests or CI. A
# container image built from an unchanged binary is money spent to produce a
# byte-identical artifact. This workflow hashes exactly the inputs that end up
# in the image (`image.inputs` in .claude/agent-ci.json; for the sample, Go
# sources, go.mod/go.sum and the Dockerfile) and looks for an image already
# tagged with that hash. Found: retag it as `latest` and stop. Not found: build
# and push.
#
# It is the same idea as Expo's fingerprint gate (hash the native layer, reuse a
# matching build, otherwise rebuild), applied to a plain Go service.
#
# Runs on main only. PRs never build images; pr-checks.yml is enough to review.
# Pushes to GHCR with the built-in GITHUB_TOKEN; no extra secret.

name: Build image

on:
  push:
    branches: [main]
    # First gate, free: a push touching none of these never starts a runner.
    # GitHub reads it before any runner exists, so it cannot come from the
    # config: keep it a superset of `image.inputs`.
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Dockerfile
      - .claude/agent-ci.json
      - .github/workflows/build-image.yml
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Second gate, cheap: the path filter cannot tell a comment-only edit to a
      # test file from a real change, and it fires on this workflow file too.
      # Hash only what reaches the image, as `image.inputs` lists it. The
      # sample excludes _test.go files on purpose: they never ship.
      - name: Hash image inputs
        id: hash
        run: |
          cfg=.claude/agent-ci.json
          mapfile -t inputs < <(jq -r '.image.inputs // [] | .[]' "$cfg")
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::error file=$cfg::No image.inputs. Add them, or delete this workflow if you do not ship an image."
            exit 1
          fi
          context="$(jq -r '.image.context // "."' "$cfg")"
          dockerfile="$(jq -r '.image.dockerfile // "Dockerfile"' "$cfg")"
          # The build settings are part of the hash: pointing at another
          # context or Dockerfile must build, not retag the old image.
          hash="$( { git ls-files -z -- "${inputs[@]}" | sort -z | xargs -0 sha256sum
            printf 'context=%s\ndockerfile=%s\n' "$context" "$dockerfile"; } | sha256sum | cut -c1-16)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "hash=$hash"
            echo "image=$image"
            echo "context=$context"
            echo "dockerfile=$dockerfile"
          } >> "$GITHUB_OUTPUT"
          echo "Image inputs hash: $hash"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Look for an image with this hash
        id: existing
        env:
          REF: ${{ steps.hash.outputs.image }}:src-${{ steps.hash.outputs.hash }}
        run: |
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "### Build skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$REF\` already exists; inputs unchanged. Retagged as latest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag existing image
        if: steps.existing.outputs.found == 'true'
        env:
          IMAGE: ${{ steps.hash.outputs.image }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:src-$HASH"

      - name: Set up Buildx
        if: steps.existing.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.hash.outputs.context }}
          file: ${{ steps.hash.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.hash.outputs.image }}:src-${{ steps.hash.outputs.hash }}
            ${{ steps.hash.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.hash.outputs.image }}:latest
          # Layer cache in GitHub's cache service: a rebuild after a one-line
          # change reuses the module download layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
